<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Patient Registration | Clinic</title>

  <!-- Inter Font -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="patient-page">

    <div class="registration-card">

      <!-- Clinic Header -->

      <div class="clinic-header">

        <div class="clinic-logo">+</div>

        <div>
          <h2>Clinic Automation</h2>
          <p>Patient Registration</p>
        </div>

      </div>


      <!-- Heading -->

      <div class="form-header">

        <span class="eyebrow">
          TODAY'S VISIT
        </span>

        <h1>Get your consultation token</h1>

        <p>
          Enter your details below to join the queue.
        </p>

      </div>


      <!-- Registration Form -->

      <form id="registrationForm">

        <!-- Name -->

        <div class="form-group">

          <label for="name">
            Patient Name
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >

          <small class="error-message" id="nameError">
            Please enter your name.
          </small>

        </div>


        <!-- Age -->

        <div class="form-group">

          <label for="age">
            Age
          </label>

          <input
            type="number"
            id="age"
            name="age"
            placeholder="Enter your age"
            min="1"
            max="120"
            required
          >

          <small class="error-message" id="ageError">
            Please enter a valid age.
          </small>

        </div>


        <!-- Mobile -->

        <div class="form-group">

          <label for="mobile">
            Mobile Number
          </label>

          <input
            type="tel"
            id="mobile"
            name="mobile"
            placeholder="10-digit mobile number"
            maxlength="10"
            inputmode="numeric"
            autocomplete="tel"
            required
          >

          <small class="error-message" id="mobileError">
            Enter a valid 10-digit mobile number.
          </small>

        </div>


        <!-- Reason -->

        <div class="form-group">

          <label for="reason">
            Reason for Visit
          </label>

          <select
            id="reason"
            name="reason"
            required
          >

            <option value="" disabled selected>
              Select reason
            </option>

            <option value="Fever">
              Fever
            </option>

            <option value="Cold / Cough">
              Cold / Cough
            </option>

            <option value="Headache">
              Headache
            </option>

            <option value="Body Pain">
              Body Pain
            </option>

            <option value="Stomach Pain">
              Stomach Pain
            </option>

            <option value="Skin Problem">
              Skin Problem
            </option>

            <option value="Blood Pressure Check">
              Blood Pressure Check
            </option>

            <option value="Diabetes Check">
              Diabetes Check
            </option>

            <option value="Injury / Wound">
              Injury / Wound
            </option>

            <option value="Follow-up">
              Follow-up
            </option>

            <option value="Other">
              Other
            </option>

          </select>

          <small class="error-message" id="reasonError">
            Please select a reason.
          </small>

        </div>

<!-- Additional Information -->

<<div class="form-group">

  <label for="issue">
    Additional Information
    <span class="optional-label">Optional</span>
  </label>

  <textarea
    id="issue"
    name="issue"
    rows="4"
    maxlength="300"
    placeholder="Any symptoms or details you'd like the doctor to know..."
  </textarea>

</div>

        <!-- Submit -->

        <button
          type="submit"
          class="submit-button"
          id="submitButton"
        >
          Get Token
          <span>→</span>
        </button>

      </form>


      <!-- Privacy -->

      <p class="privacy-note">
        Your details are used only for today's clinic visit.
      </p>


      <!-- Token Result -->

      <div
        class="token-result"
        id="tokenResult"
      >

        <div class="success-icon">
          ✓
        </div>

        <p class="success-label">
          REGISTRATION COMPLETE
        </p>

        <h2>Your Token Number</h2>

        <div
          class="token-number"
          id="tokenNumber"
        >
          A-024
        </div>

        <p id="patientDisplay"></p>

        <div class="waiting-status">
          ● Waiting for your turn
        </div>

      </div>

    </div>

  </main>


  <script src="register.js"></script>

</body>
</html>
